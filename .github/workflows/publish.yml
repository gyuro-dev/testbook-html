# 公開。v* のタグを push すると、testbook.html と SHA-256 を GitHub のリリースに添付する。
# リリースのノートは CHANGELOG.md のその版の節から作る（.github/scripts/release_notes.sh。節がなければ止まる）。
# 環境 release の承認（本人）を通ってから公開する。キャッシュは使わない（汚れたキャッシュが成果物に入らないように）。
name: Publish
on:
  push:
    tags: ["v*"]

permissions: {}
concurrency: publish

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: タグと APP_VERSION と CHANGELOG が同じ版か確かめ、成果物を作る
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          app=$(grep -oE "const APP_VERSION = '[^']+'" testbook.html | sed -E "s/.*'([^']+)'.*/\1/")
          if [ "$app" != "$version" ]; then echo "APP_VERSION ($app) != tag ($version)"; exit 1; fi
          mkdir -p dist
          cp testbook.html dist/testbook.html
          bash .github/scripts/release_notes.sh "$version" > dist/notes.md
          (cd dist && sha256sum testbook.html > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 試験を流してから公開する
        env:
          TZ: Asia/Tokyo
        run: bash test/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # ランナーに入っている gh でリリースを作る（外の Action を増やさない）
      - name: GitHub のリリースを作って testbook.html を添付する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --title "testbook $VERSION" --notes-file dist/notes.md --verify-tag \
            dist/testbook.html dist/SHA256SUMS.txt
