<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>testbook</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e4e7eb; --line2:#d3d8de; --text:#1d2330; --muted:#6b7380;
  --accent:#2f6fde; --accent-weak:#e8f0fd; --head:#f1f3f6; --cur-row:#f2f6ff; --hover:#f3f5f8;
  --ok:#17804a; --ok-bg:#e1f4e8; --ng:#cc3434; --ng-bg:#fde6e6; --hold:#a86a10; --hold-bg:#fcf1d8;
  --na:#6b7380; --na-bg:#eceef1; --shadow:0 6px 24px rgba(20,30,50,.16); --dot:#e3e6ea; --row-na:#eef0f3; --row-hold:#fff7e0; --c-red:#d32f2f; --c-blue:#1565c0; --c-green:#2e7d32; --c-orange:#e65100; --c-gray:#80868f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1b1f26; --line:#2a3039; --line2:#373e49; --text:#e3e6eb; --muted:#8c94a2;
    --accent:#5b8ff0; --accent-weak:#1f2b42; --head:#20252d; --cur-row:#1d2536; --hover:#21262e;
    --ok:#4cc584; --ok-bg:#15301f; --ng:#f06b6b; --ng-bg:#3b1c1c; --hold:#e0a84a; --hold-bg:#352a14;
    --na:#9aa1ad; --na-bg:#262b33; --shadow:0 6px 24px rgba(0,0,0,.5); --dot:#2a3039; --row-na:#22262d; --row-hold:#2f2815; --c-red:#ff6b6b; --c-blue:#6ea8ff; --c-green:#5fd08a; --c-orange:#ffa94d; --c-gray:#8c94a2;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 "Segoe UI","Yu Gothic UI","Meiryo",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--hover)}
button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
select,input[type=text],input[type=search],textarea.f{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 8px}
select:focus,input:focus,textarea.f:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.muted{color:var(--muted)}
.spacer{flex:1}
[hidden]{display:none!important}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;color:var(--accent);letter-spacing:.02em;margin-right:4px}
.title{font-size:15px;font-weight:600;border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:6px;width:min(36vw,420px)}
.title:hover{border-color:var(--line)}
.title:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.status.dirty{color:var(--hold)}
.me{display:flex;align-items:center;gap:6px}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:700}

/* tabs & toolbar */
.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:7px 12px 6px;color:var(--muted)}
.tab:hover{background:transparent;color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600;background:transparent}
.tab.free::before{content:"";display:inline-block;width:9px;height:9px;border:1.5px solid currentColor;border-radius:2px;margin-right:6px;opacity:.7}
.tab.add{color:var(--muted);padding:7px 8px 6px}
.toolbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.toolbar .sep{width:1px;height:20px;background:var(--line2);margin:0 2px}
.toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-left:auto}
.bar{display:inline-flex;width:140px;height:8px;border-radius:4px;overflow:hidden;background:var(--line);flex:none}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-ng{background:var(--ng)} .bar .b-hold{background:var(--hold)} .bar .b-na{background:var(--na)}

/* grid */
.main{flex:1;display:flex;min-height:0}
.gridwrap{flex:1;overflow:auto;position:relative;background:var(--panel);scroll-padding-top:34px}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th{position:sticky;top:0;z-index:3;background:var(--head);font-weight:600;font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);white-space:nowrap;user-select:none}
.grid th[data-act]{cursor:pointer}
.grid th[data-act]:hover{color:var(--text);background:var(--hover)}
.colrs{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize}
.colrs:hover,.colrs.drag{background:var(--accent)}
/* 行・列をドラッグで動かすとき。選んだ行の No は、つかめることが分かるように */
#dropline{position:fixed;z-index:50;background:var(--accent);pointer-events:none;border-radius:2px}
.grid td.nocell.insel{cursor:grab}
body.dragrow,body.dragrow *{cursor:grabbing!important}
body.dragcol,body.dragcol *{cursor:grabbing!important}
.grid th[data-cid]{cursor:pointer}
.grid td{padding:5px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;white-space:pre-wrap;word-break:break-word;cursor:cell;user-select:none}
.grid td.ro{color:var(--muted);cursor:default}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.ro.num{font-size:12px}
.grid td.lv{font-weight:500}
.grid td.dup{color:transparent!important}
.grid td.nb{border-bottom-color:transparent}
.grid td.small{font-size:12px}
.grid td.pick{cursor:pointer}
.grid td.center{text-align:center}
.grid tr:hover td{background-color:var(--hover)}
.grid tr.currow td{background-color:var(--cur-row)}
.grid tr td.insel{background-color:var(--accent-weak)!important}
.grid tr.sp td{padding:0;border:0;background:transparent}
.grid td.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.grid td.cur.dup{color:var(--muted)!important}
.grid tr.row-na td{background-color:var(--row-na);color:var(--muted)}
.grid tr.row-hold td{background-color:var(--row-hold)}
.fb{font-weight:700!important}
.fs{text-decoration:line-through}
.fc-red{color:var(--c-red)!important}.fc-blue{color:var(--c-blue)!important}.fc-green{color:var(--c-green)!important}.fc-orange{color:var(--c-orange)!important}.fc-gray{color:var(--c-gray)!important}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;border:1px solid var(--line2)}
.pane{position:relative}
.pane-x{position:absolute;top:8px;right:8px;font-size:18px}
.tab.colored{box-shadow:inset 0 3px 0 var(--tabc)}
.tx.bd{border:1.5px solid var(--text);border-radius:4px;padding:6px 10px}
.grid td.dup>*{visibility:hidden}
.grid td.cur.dup>*{visibility:visible}
.grid td.nocell{position:relative}
.grid td.fz{position:sticky;z-index:1;background-color:var(--panel)}
.thn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins{position:absolute;z-index:8;width:18px;height:18px;padding:0;border-radius:50%;border:1.5px solid var(--accent);background:var(--panel);color:var(--accent);font-size:14px;font-weight:700;line-height:1;display:none;place-items:center;cursor:pointer}
.ins:hover{background:var(--accent);color:#fff}
.ins-c{right:-10px;top:50%;transform:translateY(-50%)}
.ins-r,.ins-r0{left:50%;bottom:-10px;transform:translateX(-50%)}
.grid th:hover{z-index:6}
.grid th:hover>.ins-c,.grid th:first-child:hover>.ins-r0,.grid tr:hover .ins-r{display:grid}
.grid tr:hover>td:first-child{z-index:3}
.grid th.fz{z-index:5}
.grid th.fz:hover{z-index:7}
.grid .fzl{box-shadow:inset -1px 0 0 var(--line2),5px 0 6px -5px rgba(15,25,40,.25)}
.grid td.cf{background-image:linear-gradient(225deg,var(--hold) 8px,transparent 8px)}
.grid th.addcol{text-align:center;cursor:pointer;font-size:15px;border-right:none}
.grid th.addcol:hover{color:var(--accent);background:var(--hover)}
.addrow{position:sticky;left:8px;margin:8px 0 40px 8px;border-style:dashed;color:var(--muted)}
.addrow:hover{border-color:var(--accent);color:var(--accent)}
.cfbtn{color:var(--hold);border-color:var(--hold);font-weight:600}
.evinfo{display:flex;gap:8px;flex-wrap:wrap;max-height:170px;overflow:auto;width:100%}
.evinfo .box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;flex:1 1 200px;max-width:460px;font-size:12px}
.evinfo .box b{display:block;color:var(--muted);font-weight:500;font-size:11px}
.evinfo .box div{white-space:pre-wrap;word-break:break-word}
.dlg.wide{width:min(780px,100%);max-height:86vh;overflow:auto}
.cf-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.cf-where{font-weight:600;margin-bottom:6px}
.cf-vals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cf-vals>div{background:var(--bg);border-radius:6px;padding:6px 8px;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:140px;overflow:auto}
.cf-vals b{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:2px}
.cf-item .row{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.grid td.empty{padding:48px 16px;text-align:center;color:var(--muted);cursor:default;white-space:normal}
.grid td.empty p{margin:0 0 12px}
.grid td.empty .btns{display:flex;gap:8px;justify-content:center}
.empty-in{position:sticky;left:0;width:min(640px,calc(100vw - 480px));min-width:280px}
.ev-n{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:12px}
.ev-add{color:var(--muted);opacity:0}
.grid tr:hover .ev-add,.grid td.cur .ev-add{opacity:.6}
.chip{display:inline-block;padding:0 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-size:12px;line-height:20px}
.ck{display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;font-size:12px;line-height:1;vertical-align:-3px}
.ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
#editor{position:absolute;z-index:4;margin:0;padding:4px 7px;font:inherit;line-height:1.5;color:var(--text);background:var(--panel);border:2px solid var(--accent);border-radius:0;resize:none;outline:none;opacity:0;pointer-events:none;overflow:hidden;left:0;top:0;width:10px;height:28px}
#editor.editing{opacity:1;pointer-events:auto;box-shadow:var(--shadow)}
#reditor{position:absolute;z-index:4;padding:4px 7px;line-height:1.5;color:var(--text);background:var(--panel);border:2px solid var(--accent);outline:none;white-space:pre-wrap;word-break:break-word;left:0;top:0;display:none;box-shadow:var(--shadow);cursor:text}
#reditor.editing{display:block}
.tx-ed[contenteditable]{white-space:pre-wrap;word-break:break-word;cursor:text}

.pill{display:inline-block;min-width:44px;text-align:center;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:20px}
.v-ok{color:var(--ok);background:var(--ok-bg)} .v-ng{color:var(--ng);background:var(--ng-bg)}
.v-hold{color:var(--hold);background:var(--hold-bg)} .v-na{color:var(--na);background:var(--na-bg)}
.v-none{color:var(--muted);background:transparent}

/* pane */
.pane{width:400px;flex:none;border-left:1px solid var(--line);background:var(--bg);overflow:auto;padding:14px 16px 40px}
.pane-empty{color:var(--muted);padding:40px 8px;text-align:center}
.crumb{font-size:12px;color:var(--muted)}
.pane-title{font-size:15px;font-weight:600;margin:2px 0 10px;white-space:pre-wrap}
.pane-title .no{color:var(--muted);font-weight:500;margin-right:6px}
.kv{margin:0 0 12px;display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;white-space:pre-wrap}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.sec-h{font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.count{font-size:11px;background:var(--accent-weak);color:var(--accent);border-radius:999px;padding:0 7px;font-weight:600}
.vbtns{display:flex;gap:6px;flex-wrap:wrap}
.vbtns button{min-width:58px}
.vbtns button.sel.v-ok{border-color:var(--ok)} .vbtns button.sel.v-ng{border-color:var(--ng)}
.vbtns button.sel.v-hold{border-color:var(--hold)} .vbtns button.sel.v-na{border-color:var(--na)}
.vbtns button:not(.sel){background:var(--panel);color:var(--muted)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fl input,.fl textarea{color:var(--text);width:100%}
.fl textarea{resize:vertical;min-height:52px}
.minib{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel);max-height:420px}
.minib:hover{border-color:var(--accent)}
.minib .board{transform-origin:0 0;pointer-events:none;position:absolute;left:0;top:0}
.ev-empty{border:1.5px dashed var(--line2);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer}
.ev-empty:hover{border-color:var(--accent);color:var(--accent)}

/* board（エビデンス票・自由シート） */
.boardview{flex:1;display:flex;flex-direction:column;min-height:0}
.boardbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.bb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bb-title{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-title .crumb{font-weight:400;margin-right:6px}
.bb-row .fl{flex-direction:row;align-items:center;gap:6px}
.bb-row .fl input{width:auto}
.bb-row .hint{font-size:12px;color:var(--muted);margin-left:auto}
.boardwrap{flex:1;overflow:auto;background:var(--bg);outline:none}
.board{position:relative;background-color:var(--panel);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:16px 16px;min-width:100%;min-height:100%}
.board-hint{position:absolute;left:24px;top:24px;color:var(--muted);line-height:1.9;pointer-events:none}
.el{position:absolute}
.el.sel{outline:2px solid var(--accent);outline-offset:3px}
.rh{position:absolute;right:-8px;bottom:-8px;width:12px;height:12px;background:var(--accent);border:2px solid var(--panel);border-radius:3px;cursor:nwse-resize;display:none;pointer-events:auto}
.el.sel .rh{display:block}
.tx{white-space:pre-wrap;word-break:break-word;padding:4px 6px;font-size:14px;line-height:1.6;min-height:28px;cursor:move}
.tx.title{font-size:22px;font-weight:700;line-height:1.4}
.tx.log,.tx-ed.log{font:12px/1.5 Consolas,"BIZ UDGothic",monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.tx a{color:var(--accent)}
.tx-ed{display:block;width:100%;border:none;outline:none;resize:none;overflow:hidden;background:transparent;padding:4px 6px;font-size:14px;line-height:1.6;min-height:28px}
.tx-ed.title{font-size:22px;font-weight:700;line-height:1.4}
.el-image img{display:block;width:100%;height:100%;border:1px solid var(--line);user-select:none;cursor:move}
.el-marker{border-radius:50%;color:#fff;background:#e03131;display:grid;place-items:center;font-weight:700;font-size:14px;line-height:1;cursor:move;box-shadow:0 1px 3px rgba(0,0,0,.35);user-select:none}
.el-marker.c-blue{background:#1c7ed6} .el-marker.c-green{background:#2b8a3e} .el-marker.c-black{background:#222}
.el-marker.sel{outline-offset:2px}
.grid td.cm{background-image:linear-gradient(45deg,transparent 0,transparent calc(100% - 9px),var(--accent) calc(100% - 9px))}
.grid td.cf.cm{background-image:linear-gradient(225deg,var(--hold) 8px,transparent 8px),linear-gradient(45deg,transparent 0,transparent calc(100% - 9px),var(--accent) calc(100% - 9px))}
.cmts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cmt{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.cmt.done{opacity:.6} .cmt.done .cmt-t{text-decoration:line-through}
.cmt-h{display:flex;align-items:center;gap:6px;margin-bottom:3px} .cmt-h .muted{font-size:11px;flex:1} .cmt-h label{display:flex;align-items:center;gap:4px;cursor:pointer}
.cmt-t{white-space:pre-wrap;word-break:break-word}
.cmt-new textarea{width:100%;min-height:40px;margin-bottom:6px}
.hist{font-size:12px;display:flex;flex-direction:column;gap:4px}
.hist .pill{min-width:0;padding:0 6px;line-height:18px;font-size:11px}
.hist>div{display:flex;align-items:center;gap:4px;flex-wrap:wrap} .hist .hx{margin-left:auto;padding:0 5px;color:var(--muted)} .hist .hx:hover{color:var(--ng)}
.grid td.idc{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fold{border:none;background:transparent;padding:0 5px 0 0;margin:0;color:var(--muted);cursor:pointer;font-size:11px;line-height:1;vertical-align:1px}
.fold:hover{color:var(--accent);background:transparent}
.cfmark{color:var(--accent);font-size:9px}
.grid th.cfon .thn{color:var(--accent)}
.cfl{display:flex;flex-direction:column;max-height:50vh;overflow:auto;padding:2px 6px;gap:2px}
.cfl label{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.cfb{display:flex;gap:6px;padding:6px 4px 2px;align-items:center}
.cfb button{border:1px solid var(--line2)}
#pop .cfb button.primary{color:#fff}
.el-frame{border:3px solid #e03131;border-radius:3px;pointer-events:none}
.el-frame.c-yellow{border-color:#f59f00} .el-frame.c-blue{border-color:#1c7ed6}
.el-frame.c-black{border-color:#111;background:#111;pointer-events:auto;cursor:move} .el-frame.c-white{border-color:#fff;background:#fff;pointer-events:auto;cursor:move}
.el-line{pointer-events:none}
.el-line svg{display:block;overflow:visible}
.el-line line.hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:move}
.el-line line.vis{stroke-width:3;stroke-linecap:round;pointer-events:none}
.el-line.sel{outline:none}
.el-line.sel line.vis{filter:drop-shadow(0 0 2px var(--accent))}
.lh{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:crosshair;pointer-events:auto}
.el-frame .edge{position:absolute;pointer-events:auto;cursor:move}
.edge.t{left:-6px;right:-6px;top:-7px;height:10px} .edge.b{left:-6px;right:-6px;bottom:-7px;height:10px}
.edge.l{top:-6px;bottom:-6px;left:-7px;width:10px} .edge.r{top:-6px;bottom:-6px;right:-7px;width:10px}
.bt{border-collapse:collapse;width:100%;background:var(--panel);table-layout:fixed}
.bt td{border:1px solid var(--line2);padding:4px 8px;white-space:pre-wrap;word-break:break-word;vertical-align:top;height:30px;cursor:cell}
.bt tr:first-child td{background:var(--head);font-weight:600}
.bt td.ed{padding:0;box-shadow:inset 0 0 0 2px var(--accent)}
.bt td textarea{display:block;width:100%;border:none;outline:none;resize:none;background:transparent;padding:4px 8px;font:inherit;min-height:28px;overflow:hidden}
.tgrip{height:10px;cursor:move;border-radius:4px 4px 0 0;background:var(--line)}
.el.sel .tgrip{background:var(--accent-weak)}
.filechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;background:var(--panel);cursor:move}
.filechip a{color:var(--accent);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:move}
.metric .mh{font-weight:600;margin-bottom:8px}
.metric .mcards{display:flex;gap:18px;margin-bottom:10px}
.metric .mcards b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.metric .mcards span{font-size:11px;color:var(--muted)}
.metric table{width:100%;border-collapse:collapse;font-size:12px}
.metric td{padding:3px 0;font-variant-numeric:tabular-nums}
.metric td:last-child{text-align:right;white-space:nowrap}
.metric.xm .mh{display:flex;align-items:baseline;flex-wrap:wrap}
.seltb{position:absolute;z-index:100000;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:3px}
.seltb button{font-size:12px;padding:2px 8px;border:none}
.seltb select{font-size:12px;padding:1px 4px}

/* summary */
.summary{flex:1;overflow:auto;padding:16px 20px 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.card .k{font-size:12px;color:var(--muted)} .card .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.card.ok .v{color:var(--ok)} .card.ng .v{color:var(--ng)} .card.hold .v{color:var(--hold)}
.summary h3{font-size:14px;margin:18px 0 8px}
table.st{border-collapse:collapse;background:var(--panel);border:1px solid var(--line);min-width:640px}
.st th,.st td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.st th{background:var(--head);color:var(--muted);font-weight:600;font-size:12px}
.st th:first-child,.st td:first-child{text-align:left}
.st tr.sub td:first-child{padding-left:28px;color:var(--muted)}
.st td.ng{color:var(--ng);font-weight:600}
.st td.pct{text-align:left;white-space:nowrap} .st .bar{width:120px;margin-right:8px;vertical-align:middle}

/* 消化の推移 */
.trend{display:block;max-width:100%;margin:4px 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.trend .ax{stroke:var(--line2);stroke-width:1} .trend .dash{stroke-dasharray:3 3}
.trend .ln{fill:none;stroke:var(--accent);stroke-width:2} .trend .pt{fill:var(--accent)} .trend .lb{font-size:10px;fill:var(--muted)}

/* 報告書（印刷用）。画面では見せず、印刷のときだけ出す */
#report{display:none;padding:24px;color:#111;background:#fff;font-size:12px}
#report h1{font-size:20px;margin:0 0 6px} #report h2{font-size:16px;margin:22px 0 8px;break-before:page} #report h3{font-size:14px;margin:18px 0 6px} #report h4{font-size:13px;margin:12px 0 4px}
#report .rmeta{color:#555;margin-bottom:10px}
#report table.rt{border-collapse:collapse;width:100%;table-layout:auto}
#report .rt th,#report .rt td{border:1px solid #bbb;padding:3px 6px;vertical-align:top;white-space:pre-wrap;word-break:break-word;font-size:11px}
#report .rt th{background:#eee} #report .rt td.num{text-align:right;white-space:nowrap}
#report .rt tr.row-na td{color:#888;background:#f3f3f3} #report .rt tr.row-hold td{background:#fff7e0}
#report .rsum{margin-bottom:10px;min-width:0} #report .rsum th,#report .rsum td{padding:3px 10px;font-size:11px;border-bottom:1px solid #ddd}
#report .rev{break-inside:avoid;margin-bottom:14px}
#report .rboard{position:relative;overflow:hidden;border:1px solid #ccc;border-radius:4px;background:#fff}
#report .rboard .board{position:absolute;left:0;top:0;background-image:none}
#report .pill{border:1px solid currentColor}
@media print{
  body.printing>#app,body.printing>#pop,body.printing>#toast,body.printing>.dlg-back{display:none!important}
  body.printing #report{display:block}
  body.printing{background:#fff}
  @page{margin:14mm}
}

/* overlays */
.foot{padding:4px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot kbd{font:11px Consolas,monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--bg)}
#pop{position:fixed;z-index:200000;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;min-width:170px;max-height:80vh;overflow:auto}
#pop button{border:none;text-align:left;border-radius:5px;display:flex;align-items:center;gap:8px;justify-content:space-between}
#pop button.danger-t{color:var(--ng)}
#pop hr{border:none;border-top:1px solid var(--line);margin:4px 2px;width:auto}
#pop .pop-h{font-size:11px;color:var(--muted);padding:2px 10px}
#pop kbd{font:11px Consolas,monospace;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:300000;background:rgba(10,12,16,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:calc(100% - 40px);box-shadow:var(--shadow);background:#fff}
.lightbox .cap{color:#dde;margin-top:10px;font-size:12px}
.dlg-back{position:fixed;inset:0;z-index:400000;background:rgba(10,12,16,.35);display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:18px;width:min(420px,100%)}
.dlg h4{margin:0 0 8px;font-size:15px}
.dlg p{margin:0 0 12px;white-space:pre-wrap;color:var(--muted)}
.dlg input{width:100%;margin-bottom:12px}
.dlg .row{display:flex;justify-content:flex-end;gap:8px}
.dlg .danger{background:var(--ng);border-color:var(--ng);color:#fff}
#toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:500000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#222833;color:#fff;padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:12px;animation:tin .15s ease-out}
#toast div.err{background:var(--ng)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
body.dragging .gridwrap,body.dragging .boardwrap{outline:3px dashed var(--accent);outline-offset:-6px}

@media (max-width:900px){
  .main{flex-direction:column}
  .gridwrap{flex:none;height:55vh}
  .pane{width:auto;border-left:none;border-top:1px solid var(--line)}
  .title{width:40vw}
  .status{display:none}
}
</style>

function moveRowsTo(r0, r1, to) {
  if (sortOf(curSheet())) { toast(_t('並べ替え中は行を移動できません。並べ替えを解除してから移動してください'), 'err'); return false; }
  if (to >= r0 && to <= r1 + 1) return false;
  // 置く場所の前後の行は、作り置きの行番号の表（noOf）から引く。全部の行を並べ直したり探したりしないので、何十万行でも行数によらない

  const next = S.rows[to] || null, prev = S.rows[to - 1] || null;
  let lo, hi;
  if (next) {

    while (j >= 0 && inBlock.has(all[j])) j--;

  } else {
    let j = prev ? noOf(sid, prev.id) : all.length;  // 一番下へ: prev のすぐ後ろ（動かす行は飛ばす）

    const t = { id: r.id, name: r.name, total: items.length, ok: 0, ng: 0, hold: 0, na: 0, none: 0, ev: 0 };
    for (const it of items) { t[rec.get(it.id + '|' + r.id) || 'none']++; if (ev.has(it.id + ':' + r.id)) t.ev++; }
    t.done = t.ok + t.ng + t.na;

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
    let data = cv.toDataURL('image/webp', 0.9);
    if (!data.startsWith('data:image/webp')) data = cv.toDataURL('image/jpeg', 0.9);
    return { data, w, h };
  } finally { URL.revokeObjectURL(url); }
}

function resolveConflict(action, id) {

/* 消化の推移: 結果を付けた日ごとに数える。日は「いつ付けたか」（結果の時刻 ts、なければ実施日の文字）から */
const dayOf = ts => { const d = new Date(ts); return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`; };
function trendData(items, run) {
  const m = new Map();
  for (const it of items) {
    const r = recOf(it.id, run);
    if (!r || !r.verdict || r.verdict === 'hold') continue;
    const day = r.ts && r.ts.verdict ? dayOf(r.ts.verdict) : (r.at || '').slice(0, 10);
    if (!/^\d{4}\/\d{2}\/\d{2}$/.test(day)) continue;
    const d = m.get(day) || { day, n: 0, ng: 0 };
    d.n++; if (r.verdict === 'ng') d.ng++;

  const days = [...m.values()].sort((a, b) => a.day < b.day ? -1 : 1);

// 累計の折れ線（SVG）。縦は項目数、横は日

  return `<svg class="trend" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${_t('消化の推移')}">
    <line x1="${L}" y1="${y(0)}" x2="${W - 8}" y2="${y(0)}" class="ax"/><line x1="${L}" y1="${y(max)}" x2="${W - 8}" y2="${y(max)}" class="ax dash"/>
    <text x="${L - 6}" y="${y(max) + 4}" class="lb" text-anchor="end">${total}</text><text x="${L - 6}" y="${y(0) + 4}" class="lb" text-anchor="end">0</text>
    <polyline points="${pts}" class="ln"/>${days.map((d, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(d.cum).toFixed(1)}" r="3" class="pt"><title>${esc(d.day)}: ${_t('累計 {0}（この日 {1}）', d.cum, d.n)}</title></circle>`).join('')}
    <text x="${x(0)}" y="${H - 6}" class="lb" text-anchor="${n > 1 ? 'start' : 'middle'}">${esc(days[0].day.slice(5))}</text>${n > 1 ? `<text x="${x(n - 1)}" y="${H - 6}" class="lb" text-anchor="end">${esc(days[n - 1].day.slice(5))}</text>` : ''}
  </svg>`;
}

const fileName = () => (dn(D.meta.title) || 'testbook').replace(/[\\/:*?"<>|]/g, '_') + '.html';

  },
  colMerge(btn) { setColumns(cs => { const c = cs.find(x => x.id === btn.dataset.cid); c.merge = c.merge === false; }); },
  // 列の値で絞り込む: その列にある値を数えて一覧にし、見せる値にチェックを付ける
  colFilter(btn) {

      <div class="cfl">${vals.map(([v, n]) => `<label><input type="checkbox" data-v="${esc(v)}"${!cur || cur.has(v) ? ' checked' : ''}> ${v === '' ? `<span class="muted">${_t('（空）')}</span>` : esc(v)} <span class="muted">(${n})</span></label>`).join('')}</div>
      <div class="cfb"><button data-act="cfAll" data-on="1">${_t('すべて選択')}</button><button data-act="cfAll" data-on="0">${_t('すべて解除')}</button><span class="spacer"></span>${cur ? `<button data-act="cfClear" data-cid="${c.id}">${_t('解除')}</button>` : ''}<button data-act="cfApply" data-cid="${c.id}" class="primary">${_t('絞り込む')}</button></div>`);

  },
  cfClear(btn) { delete S.cf[btn.dataset.cid]; S.cfVer++; renderToolbar(); renderGrid(); focusMain(); },
  cfClearAll() { for (const c of sheetCols(curSheet())) delete S.cf[c.id]; S.cfVer++; renderToolbar(); renderGrid(); focusMain(); },
  colSort(btn) { commitEdit(); S.sort = { sheet: S.sheet, col: btn.dataset.cid, dir: btn.dataset.d }; S.sortVer++; renderToolbar(); renderGrid(); paintCursor(); focusMain(); },
  sortClear() { S.sort = null; S.sortVer++; renderToolbar(); renderGrid(); paintCursor(); focusMain(); },
  // 折りたたみと目次（大項目）
  fold(btn) {
    const sh = curSheet(), k = btn.dataset.k;

    renderGrid(); paintCursor(); focusMain();
  },
  toc(btn) {
    const sh = curSheet(), lv = foldCol(sh), fold = foldSet(sh), g = groupsOf(sh);
    if (!lv) return;
    buildIndex();
    const list = [...g].map(([k, n]) => {
      const t = tally(itemsOf(sh.id).filter(it => (it[lv.id] || '') === k), S.run);
      return `<button data-act="tocGo" data-k="${esc(k)}"><span>${fold.has(k) ? '▸' : '▾'} ${k === '' ? `<span class="muted">${_t('（なし）')}</span>` : esc(k)}</span><span class="muted" style="font-size:11px">${t.done}/${n}${t.ng ? ` <span style="color:var(--ng)">NG ${t.ng}</span>` : ''}</span></button>`;
    }).join('');
    showPop(btn, `<div class="pop-h">${esc(dn(lv.name))}（${g.size}）${_t('。クリックするとその場所へ移動します')}</div>${list}<hr><div class="cfb"><button data-act="foldAll" data-on="1">${_t('すべて折りたたむ')}</button><button data-act="foldAll" data-on="0">${_t('すべて展開')}</button></div>`);
  },
  tocGo(btn) {
    const sh = curSheet(), lv = foldCol(sh), k = btn.dataset.k;
    const it = itemsOf(sh.id).find(x => (x[lv.id] || '') === k);
    if (!it) return;
    if (S.q || S.vf) { S.q = ''; S.vf = ''; renderToolbar(); }
    S.curId = it.id; S.c = Math.max(S.c, 1);
    renderGrid(); collapse(); paintCursor(); focusMain();
  },
  foldAll(btn) {
    const sh = curSheet(), g = groupsOf(sh), on = btn.dataset.on === '1';
    for (const [k, n] of g) if (n > 1 || !on) setFold(sh, k, on);
    renderGrid(); paintCursor(); focusMain();
  },
  colFreeze(btn) { hidePop(); snap(); setF(curSheet(), 'freeze', Number(btn.dataset.n)); renderGrid(); },
  colAddEnd() {
    setColumns(cs => cs.push({ id: uid('k_'), name: _t('列{0}', sheetCols({ columns: cs }).length + 1), type: 'text', w: 140 }));
    const w = $('#gridwrap'); w.scrollLeft = w.scrollWidth;
  },
  // 行の境目の＋: その行の下に入れる（-1 なら一番上）。階層の列は上の行から引き継ぐ
  insRow(btn) {
    commitEdit(); snap();
    const r = +btn.dataset.r, first = S.rows[0];
    let it;
    if (r < 0) {
      it = addItem(null, false, (first ? first.order : 1) - 1);
      if (first) for (const c of sheetCols(curSheet())) if (c.type === 'level') it[c.id] = first[c.id] || '';
    } else it = addItem(S.rows[r], true);
    S.curId = it.id; S.c = Math.max(S.c, 1);
    renderGrid(); collapse(); paintCursor(); renderProgress(); focusMain();
  },
  // 列の境目の＋: その列の右に入れる（No の列なら一番左）
  insCol(btn) {
    const j = +btn.dataset.j;
    setColumns(cs => {
      const vis = cs.filter(x => !x.deleted), after = j > 0 ? vis[j - 1] : null;
      cs.splice(after ? cs.indexOf(after) + 1 : 0, 0, { id: uid('k_'), name: _t('列{0}', vis.length + 1), type: 'text', w: 140 });

  },
  addRowEnd() {
    commitEdit();

    renderGrid(); collapse(); paintCursor(); renderProgress(); focusMain();
  },
  async colRename(btn) {

  },
  async colOptions(btn) {
    hidePop();
    const c = colById(btn.dataset.cid);
    const n = await dialog({ title: _t('選択肢'), message: _t('選択肢を「,」か「、」で区切って入力してください。'), input: (c.options || []).join(', ') });
    if (n == null) return;
    const opts = n.split(/[,、]/).map(s => s.trim()).filter(Boolean);
    setColumns(cs => { cs.find(x => x.id === c.id).options = opts; });
  },
  async colType(btn) {
    const t = btn.dataset.t, id = btn.dataset.cid;
    let opts = null, idf = null;
    if (t === 'select' && !(colById(id).options || []).length) {
      hidePop();
      const n = await dialog({ title: _t('選択肢'), message: _t('選択肢を「,」か「、」で区切って入力してください。'), input: _t('高, 中, 低') });
      if (n == null) return;
      opts = n.split(/[,、]/).map(s => s.trim()).filter(Boolean);
    }
    if (t === 'id' && colById(id).type !== 'id') {
      hidePop();
      idf = await askIdFmt(colById(id));
      if (!idf) return;
    }
    setColumns(cs => {
      const c = cs.find(x => x.id === id);
      const res = RESULT_COLS.find(([k]) => k === t);
      if (res && /^(列|Column )\d+$/.test(c.name)) c.name = _t(res[1]);
      if (t === 'id' && /^(列|Column )\d+$/.test(c.name)) c.name = 'ID';
      c.type = t;
      if (opts) c.options = opts;
      if (idf) Object.assign(c, idf);
    });
    // ID の列にしたら、まだ番号のない行に上から振る（番号は変わらないものなので、一度振ったら触らない）
    if (t === 'id') { assignIds(curSheet(), colById(id), false); renderGrid(); renderPane(); }
  },
  async colIdFmt(btn) {
    hidePop();
    const c = colById(btn.dataset.cid), f = await askIdFmt(c);
    if (!f) return;
    setColumns(cs => Object.assign(cs.find(x => x.id === c.id), f));
    toast(_t('この形式は、これから付ける ID に使います。今ある ID を変えるときは「ID を上から振り直す」を使ってください'));
  },
  async colIdRenum(btn) {
    hidePop();
    const c = colById(btn.dataset.cid);
    if (!(await dialog({ title: _t('ID を振り直す'), message: _t('「{0}」の ID を、今の並び順に {1} から振り直します。ほかの資料で参照している ID も変わるので注意してください。', dn(c.name), fmtId(c, 1)), ok: _t('振り直す'), danger: true }))) return;
    snap(); setF(curSheet(), 'idNext', 0); assignIds(curSheet(), c, true); renderGrid(); renderPane();
  },
  colMove(btn) {
    setColumns(cs => {
      const vis = cs.filter(x => !x.deleted), i = vis.findIndex(x => x.id === btn.dataset.cid), j = i + Number(btn.dataset.d);
      if (j < 0 || j >= vis.length) return;
      const a = cs.indexOf(vis[i]), b = cs.indexOf(vis[j]);
      [cs[a], cs[b]] = [cs[b], cs[a]];
    });
  },
  colAdd(btn) {
    setColumns(cs => {
      const i = cs.findIndex(x => x.id === btn.dataset.cid) + Number(btn.dataset.d);
      cs.splice(i, 0, { id: uid('k_'), name: _t('列{0}', sheetCols({ columns: cs }).length + 1), type: 'text', w: 140 });
    });
  },
  async colDel(btn) {
    hidePop();
    const c = colById(btn.dataset.cid);
    if (sheetCols(curSheet()).length < 2) { toast(_t('最後の列は削除できません'), 'err'); return; }
    const used = !REC_FIELDS.has(c.type) && itemsOf(S.sheet).some(it => it[c.id]);
    if (used && !(await dialog({ title: _t('列を削除'), message: _t('列「{0}」とその内容を削除しますか？', dn(c.name)), ok: _t('削除'), danger: true }))) return;
    // 消した列も印だけ残す（ほかの人のファイルと合わせたときに、消したことが伝わるように）
    setColumns(cs => { cs.find(x => x.id === c.id).deleted = true; });
  },
  addRow() {
    commitEdit();
    snap();
    const it = addItem(curItem(), true);
    S.curId = it.id; S.c = Math.max(S.c, 1);
    if (S.vf || S.q) { S.vf = ''; S.q = ''; renderToolbar(); }
    renderGrid(); paintCursor(); renderProgress(); focusMain();
  },
  async delRow() {
    const rows = selRows();
    if (!rows.length) return;
    buildIndex();
    const used = rows.some(it => runs().some(r => verdictOf(it.id, r.id) || IX.el.get(evOwner(it.id, r.id))));
    const message = rows.length > 1 ? _t('{0} 行を削除しますか？', rows.length) + (used ? _t('結果やエビデンスがある行も含まれます。') : '') : _t('この行には結果やエビデンスがあります。削除しますか？');
    if ((rows.length > 1 || used) && !(await dialog({ title: _t('行を削除'), message, ok: _t('削除'), danger: true }))) return;
    snap();
    for (const it of rows) setF(it, 'deleted', true);
    S.curId = null; S.r = rng().r0; collapse();
    renderGrid(); renderProgress(); focusMain();
  },
  togglePane() { S.pane = !S.pane; lsSet('testbook.pane', S.pane ? '1' : '0'); render(); },
  async cmAdd(btn) { const ta = $('#cmtext'); if (!ta) return; if (await addComment(btn.dataset.id, btn.dataset.col, ta.value)) toast(_t('コメントを付けました')); },
  histDel(btn) { const r = D.records.find(x => x.id === btn.dataset.id); if (!r) return; histDelete(r, +btn.dataset.t); renderPane(); toast(_t('履歴を1件消しました（Ctrl+Z で元に戻せます）')); },
  histClear(btn) { const r = D.records.find(x => x.id === btn.dataset.id); if (!r) return; histClear(r); renderPane(); toast(_t('この試験項目の履歴を消しました（Ctrl+Z で元に戻せます）')); },
  async histClearAll() {
    hidePop();
    const n = D.records.filter(r => !r.deleted && r.hist && r.hist.length).length;
    if (!n) { toast(_t('結果の履歴はありません')); return; }
    if (!(await dialog({ title: _t('結果の履歴をすべて消す'), message: _t('{0} 件の結果について、「誰が・いつ・何に変えたか」の履歴をすべて消します。今の結果・実施者・実施日は消えません。消した履歴は、ほかの人のファイルと合わせても戻りません。', n), ok: _t('消去する'), danger: true }))) return;
    snap();
    const t = tick();
    for (const r of D.records) if (!r.deleted && ((r.hist && r.hist.length) || (r.histX && r.histX.length))) { setF(r, 'histClr', t); setF(r, 'hist', []); if (r.histX) setF(r, 'histX', []); }
    renderPane(); toast(_t('{0} 件の履歴を消しました（Ctrl+Z で元に戻せます）', n));
  },
  async cmDone(box) {
    const c = D.comments.find(x => x.id === box.dataset.id);
    if (!c || !(await ensureMe())) { renderPane(); return; }
    snap(); setF(c, 'done', box.checked); setF(c, 'doneBy', box.checked ? S.me : ''); setF(c, 'doneAt', box.checked ? now() : 0);
    S.ver++; renderGrid(); renderPane(); renderProgress();
  },
  cmDel(btn) {
    const c = D.comments.find(x => x.id === btn.dataset.id);
    if (!c) return;
    snap(); setF(c, 'deleted', true); renderGrid(); renderPane(); renderProgress();
  },
  // 置換: 選んでいる範囲（何個か選んでいれば）か、表に出ている行の文字の列を、そのままの文字で置き換える
  async replace() {
    commitEdit(); hidePop();
    const multi = isMulti();
    const a = await dialog({ title: _t('置換'), message: multi ? _t('選んでいる範囲の中で置き換えます。') : _t('表に表示している {0} 行の文字の列（結果の列では備考）を対象に置き換えます。大文字と小文字は区別します。', S.rows.length),
      inputs: [{ label: _t('検索する文字'), value: S.q || '' }, { label: _t('置き換える文字'), value: '' }], ok: _t('置き換える') });
    if (!a || !a[0]) return;
    const [from, to] = a, C = cols(), R = multi ? rng() : { r0: 0, r1: S.rows.length - 1, c0: 1, c1: C.length - 1 };
    const targets = [];
    for (let c = R.c0; c <= R.c1; c++) { const col = C[c]; if (col && (TEXTUAL.has(col.type) && col.type !== 'by' && col.type !== 'at')) targets.push(col); }
    let n = 0;
    snap();
    for (let r = R.r0; r <= R.r1; r++) {
      const it = S.rows[r];
      for (const c of targets) {
        const v = getCell(it, c);
        if (!v || !v.includes(from)) continue;
        // 1文字ずつの書式があるセルは、書式の区切りごとに置き換えて書式を残す（区切りをまたぐ語は置き換わらない）
        const runs = cellRuns(it, c);
        if (runs) { const nr = runs.map(x => ({ ...x, t: x.t.split(from).join(to) })).filter(x => x.t); setCellRich(it, c, runText(nr), nr.length ? nr : null); }
        else setCell(it, c, v.split(from).join(to));
        n++;
      }
    }
    renderGrid(); renderPane();
    toast(n ? _t('{0} 個のセルを置き換えました（Ctrl+Z で元に戻せます）', n) : _t('見つかりませんでした'));
  },
  fmtBold() { applyFmt('b'); },
  fmtStrike() { applyFmt('s'); },
  fmtColorMenu(btn) { showPop(btn, COLORS.map(([k, l]) => `<button data-act="fmtColor" data-v="${k}"><span><span class="swatch" style="background:${k ? `var(--c-${k})` : 'var(--text)'}"></span> ${_t(l)}</span></button>`).join('')); },
  fmtColor(btn) { hidePop(); applyFmt('c', btn.dataset.v || false); },
  tabMenu(t) {
    const s = D.sheets.find(x => x.id === t.dataset.id);
    showPop(t, `<div class="pop-h">${esc(dn(s.name))}</div><button data-act="renameSheet" data-id="${s.id}">${_t('名前の変更・削除')}</button><hr><div class="pop-h">${_t('タブの色')}</div>` +
      COLORS.map(([k, l]) => `<button data-act="tabColor" data-id="${s.id}" data-v="${k}"><span><span class="swatch" style="background:${k ? `var(--c-${k})` : 'transparent'}"></span> ${k ? _t(l) : _t('なし')}</span>${(s.color || '') === k ? '✓' : ''}</button>`).join(''));
  },
  tabColor(btn) { const s = D.sheets.find(x => x.id === btn.dataset.id); snap(); setF(s, 'color', btn.dataset.v || ''); renderTabs(); },
  sample() { loadDoc(sampleDoc(), null); markDirty(); toast(_t('サンプルを読み込みました')); },
  verdict(btn) { setVerdict(getItem(btn.dataset.id), btn.dataset.v || null); },
  popVerdict(btn) { hidePop(); setVerdict(curItem(), btn.dataset.v || null); focusMain(); },
  popSelect(btn) { hidePop(); const it = curItem(), c = cols()[S.c]; snap(); setF(it, c.id, btn.dataset.v); renderGrid(); renderPane(); focusMain(); },
  openEv(btn) { openEvidence(btn.dataset.id || S.curId); },
  closeEv: closeEvidence,
  // ◀ ▶: 表で絞り込んでいれば、その並び（S.rows）の中で前後に移る（NG だけ、証跡なしだけ、を順に見られるように）
  evNav(btn) {
    commitBoardEdit();
    const list = evNavList(), i = list.findIndex(x => x.id === S.boardItem), n = list[i + Number(btn.dataset.d)];
    if (n) openEvidence(n.id);
  },
  async tool(btn) {
    const t = btn.dataset.t, owner = boardOwner();
    if (t === 'file') { $('#elfile').click(); return; }
    if (t === 'xmetric') { $('#xfile').click(); return; }
    if (!(await ensureMe())) return;
    commitBoardEdit();
    if (t === 'text' || t === 'title' || t === 'log') { newTextAt(nextPos(owner), t === 'text' ? 'normal' : t); return; }
    snap();
    const p = nextPos(owner);
    const e = t === 'frame' ? addEl(owner, 'frame', { x: p.x, y: p.y, w: 240, h: 120, color: 'red' })
      : t === 'marker' ? addEl(owner, 'marker', { x: p.x, y: p.y, w: 28, h: 28, n: elementsOf(owner).filter(x => x.type === 'marker').reduce((m, x) => Math.max(m, x.n || 0), 0) + 1, color: 'red' })
      : t === 'table' ? addEl(owner, 'table', { x: p.x, y: p.y, w: 480, cells: [[_t('項目'), _t('内容')], ['', ''], ['', '']] })
      : t === 'arrow' || t === 'line' ? addEl(owner, 'line', { x: p.x, y: p.y + 12, w: 200, h: 0, arrow: t === 'arrow', color: 'red' })
      : t === 'xtotal' ? addEl(owner, 'xtotal', { x: p.x, y: p.y, w: 560 })
      : addEl(owner, 'metric', { x: p.x, y: p.y, w: 560, run: S.run });
    S.bSel = e.id; renderBoard();
  },
  elDel() { const e = getEl(S.bSel); if (!e) return; snap(); setF(e, 'deleted', true); S.bSel = null; renderBoard(); },
  elDup() {
    const e = getEl(S.bSel); if (!e) return;
    snap();
    const { id, ts, updatedAt, z, ...rest } = e;
    const n = addEl(e.owner, e.type, { ...clone(rest), ...(isBinary(e) ? { data: elData(e) } : {}), x: e.x + 16, y: e.y + 16, by: S.me, at: now() });
    S.bSel = n.id; renderBoard();
  },
  elFront() { const e = getEl(S.bSel); if (!e) return; snap(); setF(e, 'z', maxZ(e.owner) + 1); renderBoard(); },
  elStyle(btn) { const e = getEl(S.bSel); snap(); setF(e, 'style', btn.dataset.v); renderBoard(); },
  elColor(btn) { const e = getEl(S.bSel); snap(); setF(e, 'color', btn.dataset.v); renderBoard(); },
  elZoom() { lightbox(getEl(S.bSel)); },
  conflicts() { renderConflicts(); },
  elCopy() { const e = getEl(S.bSel); navigator.clipboard.writeText(e.text || '').then(() => toast(_t('コピーしました')), () => toast(_t('コピーできませんでした'), 'err')); },
  elFmt(btn) { const e = getEl(S.bSel); if (!e) return; const k = btn.dataset.k; snap(); setF(e, k, !e[k]); renderBoard(); },
  elFc(btn) { const e = getEl(S.bSel); if (!e) return; snap(); setF(e, 'fc', btn.dataset.v || ''); renderBoard(); },
  elNum(btn) { const e = getEl(S.bSel); if (!e) return; snap(); setF(e, 'n', Math.max(1, Math.min(99, (e.n || 1) + Number(btn.dataset.d)))); renderBoard(); },
  evInfo() { S.evInfo = !S.evInfo; lsSet('testbook.evinfo', S.evInfo ? '1' : '0'); renderBoardView(); },
  elNatural() { const e = getEl(S.bSel); snap(); const w = Math.min(e.nw || e.w, 1600); setF(e, 'w', w); setF(e, 'h', Math.round(w * e.h / e.w)); renderBoard(); },
  tblOp(btn) {
    const e = getEl(S.bSel), cells = clone(e.cells), op = btn.dataset.v;
    if (op === 'addRow') cells.push(Array(cells[0].length).fill(''));
    else if (op === 'addCol') cells.forEach(r => r.push(''));
    else if (op === 'delRow' && cells.length > 1) cells.pop();
    else if (op === 'delCol' && cells[0].length > 1) cells.forEach(r => r.pop());
    else return;
    snap(); setF(e, 'cells', cells);
    if (op === 'addCol') setF(e, 'w', e.w + 120);
    if (op === 'delCol') setF(e, 'w', Math.max(120, e.w - 120));
    renderBoard();
  },
};

function bind() {
